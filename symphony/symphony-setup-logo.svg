<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <!-- Symphony Setup's mark: the ring of eight players around a gear,, the small circles, around the conductor's point in the
       middle, on a black circle that fills the square (the owner, 2026-10-20: "a black circle that fills up the entire window"), since GitHub crops an App's logo to a circle. Drawn for this extension; it borrows no other mark. The ring is the
       Symphony orange (#D97757), the ground black (#000000), the point a warm white so it reads
       on the black at 16 px. Rasterised to public/icon/{16,32,48,128}.png by scripts/build-assets.mjs,
       which draws the 16 and 32 px sizes from the simpler geometry in that script's SMALL variant. -->
